name: Monorepo quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 25
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; node24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify pinned Node and pnpm versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expectedNode = readFileSync('.nvmrc', 'utf8').trim().replace(/^v/, '');
          const expectedPnpm = JSON.parse(readFileSync('package.json', 'utf8')).packageManager.split('@').at(-1);
          const actualPnpm = execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim();
          assert.equal(process.versions.node, expectedNode);
          assert.equal(actualPnpm, expectedPnpm);
          console.log(JSON.stringify({ node: process.versions.node, pnpm: actualPnpm }));
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: node scripts/verify-schema-archive.mjs
      - run: pnpm lint
      - name: Cold RAES Web typecheck (contracts lifecycle regression)
        run: |
          test ! -d packages/contracts/dist
          pnpm --filter @raes/web typecheck
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @raes/api exec node scripts/verify-academic-review-live.mjs --verify-completed --local
      - run: pnpm --filter @raes/api exec node scripts/verify-academic-review-postcheck.mjs --local
      - run: pnpm audit:gate
      - run: pnpm -r --if-present build
      - run: pnpm exec playwright install --with-deps chromium
      # All canonical browser tests use public pages or in-memory local fixtures.
      # Never add remote operator verifiers or real credentials to this job.
      - run: pnpm test:frontend:browser
      - run: pnpm test:academic-review:browser
